spring:
  application:
    name: minipolya-backend
  config:
    # Reads KEY=value lines from .env in the working directory (the project root
    # under IntelliJ, ./mvnw and java -jar alike), parsed as a .properties file.
    # optional: a missing .env is fine, e.g. in production where real environment
    # variables are set. Real environment variables always win over .env values.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  servlet:
    multipart:
      # Stadium photos: 10 MB a file. Larger is 413 "File too large" (GlobalExceptionHandler).
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: 8080
  tomcat:
    # Read (and drop) an over-limit upload up to this size, so the client gets the 413
    # rather than a reset connection.
    max-swallow-size: 32MB

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  bot:
    token: ${BOT_TOKEN}
    username: ${BOT_USERNAME:}
    # webhook (production: Telegram calls POST /webhooks/telegram) or polling (dev profile
    # only: a getUpdates loop, no public URL needed). The application refuses to start
    # with polling outside the dev profile.
    mode: ${TELEGRAM_BOT_MODE:webhook}
    # Checked against X-Telegram-Bot-Api-Secret-Token on every webhook call; empty refuses all.
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
    miniapp-url: ${MINIAPP_URL:}
    support-username: ${SUPPORT_USERNAME:}
  uploads:
    # Uploaded files (stadium photos) on the local filesystem, served under /api/uploads/**.
    dir: ${UPLOADS_DIR:./uploads}
  booking:
    max-weeks-ahead: 4
    hold-expiry-minutes: 10
  game:
    # How many hours before kick-off a team-vs-team game stops accepting an
    # opponent. Past this point nobody can join and a game still looking for
    # one is cancelled. Does not apply to casual games.
    opponent-deadline-hours: 3
  payments:
    # `fake` wires up FakePaymentProvider, which refuses to start under the prod
    # profile. The real ATMOS client replaces this once its API docs land.
    provider: ${PAYMENTS_PROVIDER:fake}
    # The longest a team game's hold may last (30 days); a game needing longer cannot be created.
    hold-max-minutes: 43200
    # FakePaymentProvider only (dev and tests): see "To simulate X in dev" in CLAUDE.md.
    fake:
      otp-length: 6
      otp-ttl-seconds: 180
      resend-cooldown-seconds: 60
      starting-balance: 1000000000   # tiyin = 10 000 000 so'm per fake card
      min-amount: 50000              # tiyin = 500 so'm per split, as ATMOS
      refund-window-months: 3
      delay-min-ms: 300
      delay-max-ms: 800
  # Browser origins allowed to call the API from another origin (comma-separated, exact,
  # never *). Empty, the default, sends no CORS headers: only same-origin pages can call it.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  # The dev-only sign-in (dev profile): every /api/auth/dev/* call must send this value in
  # X-Dev-Login-Key. At least 16 characters; with the dev profile active and no such key the
  # application refuses to start.
  dev:
    login-key: ${DEV_LOGIN_KEY:}
  # The real ATMOS client, active only under the "atmos" profile (it then refuses to start
  # unless every value except the two OFD codes is set). Never commit real values.
  security:
    # 32 bytes, base64 (openssl rand -base64 32): encrypts saved card tokens at rest.
    # Required under the prod and atmos profiles; elsewhere a fixed dev key is used.
    card-token-key: ${CARD_TOKEN_KEY:}
  atmos:
    base-url: ${ATMOS_BASE_URL:}
    consumer-key: ${ATMOS_CONSUMER_KEY:}
    consumer-secret: ${ATMOS_CONSUMER_SECRET:}
    store-id: ${ATMOS_STORE_ID:}
    platform-recipient-id: ${ATMOS_PLATFORM_RECIPIENT_ID:}
    # Fiscal receipt (OFD) IKPU codes: receipts are sent only when both are set.
    ofd-code-rental: ${ATMOS_OFD_CODE_RENTAL:}
    ofd-code-service: ${ATMOS_OFD_CODE_SERVICE:}
    timeout-seconds: 30
